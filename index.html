<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kidmak.com — ระบบจัดการลูกค้า</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">C</div>
        <div class="brand-text">
          <strong>Kidmak.com</strong>
          <span>ระบบจัดการลูกค้า</span>
        </div>
      </div>

      <nav class="nav" id="nav">
        <a class="nav-item" href="#/dashboard" data-route="dashboard">
          <span class="nav-ico">▦</span> แดชบอร์ด
        </a>
        <a class="nav-item" href="#/records" data-route="records">
          <span class="nav-ico">☰</span> รายชื่อลูกค้า
        </a>
        <a class="nav-item" href="#/pipeline" data-route="pipeline">
          <span class="nav-ico"> ⇄</span> ขั้นตอนการขาย
        </a>
        <a class="nav-item" href="#/settings/fields" data-route="settings" id="nav-settings">
          <span class="nav-ico">⚙</span> ตั้งค่าฟิลด์
        </a>
        <a class="nav-item" href="#/users" data-route="users" id="nav-users" hidden>
          <span class="nav-ico">👥</span> จัดการผู้ใช้
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-box" id="user-box">
          <div class="avatar" id="user-avatar">?</div>
          <div class="user-meta">
            <strong id="user-name">—</strong>
            <span class="role-pill" id="user-role">—</span>
          </div>
          <button class="link-btn" id="btn-logout">ออกจากระบบ</button>
        </div>
        <div class="storage-badge" id="storage-badge" title="แหล่งเก็บข้อมูล">
          <span class="dot"></span><span id="storage-label">กำลังตรวจสอบ…</span>
        </div>
        <div class="sidebar-actions">
          <button class="link-btn" id="btn-export-side">ส่งออก CSV</button>
          <button class="link-btn" id="btn-import-side">นำเข้า CSV</button>
          <button class="link-btn danger" id="btn-reset">ล้าง/เติมข้อมูลตัวอย่าง</button>
        </div>
      </div>
    </aside>

    <main class="main" id="main"><!-- rendered by app.js --></main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>
  <input type="file" id="csv-file-input" accept=".csv,text/csv" hidden />

  <script src="shared/seed.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/csv.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
